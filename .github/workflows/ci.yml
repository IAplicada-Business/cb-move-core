# CI desativado temporariamente (format/lint/E2E ainda não alinhados ao repo).
# Para reativar: restaurar triggers push/pull_request abaixo.
name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test
